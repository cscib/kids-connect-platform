<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maltese Learning Engagement Simulator</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=cabinet-grotesk@500,700&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.35rem);
      --text-xl: clamp(1.45rem, 1.15rem + 1.1vw, 1.9rem);
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem; --space-16: 4rem;
      --color-bg: #f7f6f2; --color-surface: #f9f8f5; --color-surface-2: #fbfbf9; --color-surface-offset: #edeae5; --color-border: #d4d1ca;
      --color-text: #28251d; --color-text-muted: #69655f; --color-text-faint: #9c9891; --color-text-inverse: #f9f8f4;
      --color-primary: #01696f; --color-primary-hover: #0c4e54; --color-primary-highlight: #cedcd8;
      --color-success: #437a22; --color-warning: #964219; --color-error: #a12c7b; --color-gold: #d19900; --color-blue: #006494; --color-purple: #7a39bb;
      --radius-sm: .45rem; --radius-md: .75rem; --radius-lg: 1rem; --radius-xl: 1.25rem; --radius-full: 9999px;
      --shadow-sm: 0 1px 2px rgba(40,37,29,.06); --shadow-md: 0 8px 24px rgba(40,37,29,.08); --shadow-lg: 0 18px 42px rgba(40,37,29,.12);
      --font-body: 'Satoshi', 'Inter', sans-serif; --font-display: 'Cabinet Grotesk', 'Satoshi', sans-serif;
      --transition: 180ms cubic-bezier(.16,1,.3,1);
      --content-wide: 1240px;
    }
    [data-theme="dark"] {
      --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d; --color-surface-offset: #2a2825; --color-border: #393836;
      --color-text: #ece7dd; --color-text-muted: #b9b1a5; --color-text-faint: #8d877d; --color-text-inverse: #1d1b18;
      --color-primary: #4f98a3; --color-primary-hover: #227f8b; --color-primary-highlight: #313b3b;
      --color-success: #7cb14d; --color-warning: #cb7b53; --color-error: #d163a7; --color-gold: #e8af34; --color-blue: #7eb0dc; --color-purple: #b389e0;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.22); --shadow-md: 0 8px 24px rgba(0,0,0,.28); --shadow-lg: 0 18px 42px rgba(0,0,0,.38);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;scroll-behavior:smooth}
    body{font-family:var(--font-body);font-size:var(--text-base);line-height:1.55;background:var(--color-bg);color:var(--color-text)}
    button,input,select{font:inherit;color:inherit}
    button{cursor:pointer;border:none;background:none}
    a{color:inherit}
    .skip-link{position:absolute;left:-9999px;top:auto}.skip-link:focus{left:var(--space-4);top:var(--space-4);background:var(--color-primary);color:var(--color-text-inverse);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);z-index:50}
    .app{display:grid;grid-template-columns:280px 1fr;grid-template-rows:auto 1fr;height:100dvh}
    .sidebar{grid-row:1/-1;background:var(--color-surface);border-right:1px solid rgba(40,37,29,.12);padding:var(--space-6) var(--space-4);overflow-y:auto;overscroll-behavior:contain}
    .brand{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-8)}
    .brand svg{width:42px;height:42px;color:var(--color-primary)}
    .brand h1{font-family:var(--font-display);font-size:var(--text-lg);line-height:1.1}
    .brand p,.nav-note{font-size:var(--text-xs);color:var(--color-text-muted)}
    .nav{display:grid;gap:var(--space-2)}
    .nav button{width:100%;text-align:left;padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);font-size:var(--text-sm);display:flex;justify-content:space-between;align-items:center;transition:background var(--transition),color var(--transition)}
    .nav button.active,.nav button:hover,.nav button:focus-visible{background:var(--color-primary-highlight);color:var(--color-primary)}
    .header{grid-column:2;display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);padding:var(--space-4) var(--space-6);border-bottom:1px solid rgba(40,37,29,.12);background:color-mix(in srgb, var(--color-surface) 84%, transparent);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}
    .header h2{font-family:var(--font-display);font-size:var(--text-xl);line-height:1.1}
    .header p{font-size:var(--text-sm);color:var(--color-text-muted)}
    .header-actions{display:flex;gap:var(--space-2);align-items:center}
    .icon-btn,.chip-btn{min-width:44px;min-height:44px;border-radius:var(--radius-full);border:1px solid rgba(40,37,29,.12);background:var(--color-surface-2);display:inline-flex;align-items:center;justify-content:center;transition:all var(--transition)}
    .chip-btn{padding:0 var(--space-4);gap:var(--space-2);border-radius:var(--radius-full);font-size:var(--text-sm)}
    .icon-btn:hover,.chip-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
    .main{grid-column:2;overflow-y:auto;overscroll-behavior:contain;padding:var(--space-6)}
    .page{display:none;max-width:var(--content-wide);margin:0 auto;gap:var(--space-6)}
    .page.active{display:grid}
    .hero-grid,.two-col,.triple{display:grid;gap:var(--space-6)}
    .hero-grid{grid-template-columns:1.25fr .95fr}
    .two-col{grid-template-columns:1.15fr .85fr}
    .triple{grid-template-columns:repeat(3,minmax(0,1fr))}
    .card{background:var(--color-surface);border:1px solid rgba(40,37,29,.12);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);padding:var(--space-5)}
    .card h3{font-size:var(--text-lg);font-family:var(--font-display);margin-bottom:var(--space-3)}
    .card h4{font-size:var(--text-sm);text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-muted);margin-bottom:var(--space-2)}
    .card p,.card li{max-width:72ch}
    .muted{color:var(--color-text-muted)} .faint{color:var(--color-text-faint)}
    .badge{display:inline-flex;align-items:center;gap:var(--space-2);padding:.4rem .8rem;border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
    .b-enc{background:rgba(1,105,111,.12);color:var(--color-primary)} .b-cel{background:rgba(67,122,34,.14);color:var(--color-success)} .b-emp{background:rgba(161,44,123,.12);color:var(--color-error)} .b-rew{background:rgba(209,153,0,.14);color:var(--color-gold)}
    .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-4)}
    .kpi{background:var(--color-surface-2);padding:var(--space-4);border-radius:var(--radius-lg);border:1px solid rgba(40,37,29,.08)}
    .kpi .label{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-muted)}
    .kpi .value{font-size:var(--text-xl);font-family:var(--font-display);margin-top:var(--space-2);font-variant-numeric:tabular-nums lining-nums}
    .controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-4)}
    label{display:grid;gap:var(--space-2);font-size:var(--text-sm)}
    select,input[type="range"]{width:100%;background:var(--color-surface-2);border:1px solid rgba(40,37,29,.12);border-radius:var(--radius-md);padding:.85rem 1rem}
    table{width:100%;border-collapse:collapse;font-size:var(--text-sm)}
    th,td{padding:.8rem .65rem;border-bottom:1px solid rgba(40,37,29,.10);vertical-align:top;text-align:left}
    th{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--color-text-muted)}
    .sim-row{cursor:pointer;transition:background var(--transition)}
    .sim-row:hover{background:rgba(1,105,111,.05)}
    .mascot-stage{display:grid;place-items:center;min-height:320px;background:linear-gradient(180deg,color-mix(in srgb,var(--color-primary-highlight) 72%, transparent),transparent);border-radius:var(--radius-xl);position:relative;overflow:hidden}
    .speech{position:absolute;top:var(--space-4);right:var(--space-4);max-width:220px;background:var(--color-surface-2);padding:var(--space-3) var(--space-4);border-radius:var(--radius-lg);border:1px solid rgba(40,37,29,.12);box-shadow:var(--shadow-sm);font-size:var(--text-sm)}
    .stage-meta{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-4)}
    .token{padding:.45rem .75rem;border-radius:var(--radius-full);background:var(--color-surface-offset);font-size:var(--text-xs)}
    .mascot-shell{position:relative;width:220px;height:220px}
    .mascot{position:absolute;inset:0;transform-origin:center bottom;transition:transform .35s ease,filter .35s ease}
    .mascot[data-state="celebratory"]{transform:translateY(-8px) rotate(-2deg) scale(1.04);filter:drop-shadow(0 14px 26px rgba(67,122,34,.18))}
    .mascot[data-state="empathetic"]{transform:translateY(4px) rotate(1.5deg) scale(.985)}
    .mascot[data-state="encouraging"]{animation:wag 1.7s ease-in-out infinite}
    .mascot .heart,.mascot .star,.mascot .tear{opacity:0;transition:opacity .25s ease}
    .mascot[data-state="celebratory"] .star{opacity:1}
    .mascot[data-state="empathetic"] .tear{opacity:1}
    .mascot[data-state="encouraging"] .heart{opacity:1}
    @keyframes wag{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
    .xp-ring{display:grid;place-items:center;width:132px;height:132px;border-radius:50%;margin:auto;background:conic-gradient(var(--color-primary) calc(var(--fill,60)*1%), var(--color-surface-offset) 0);padding:10px}
    .xp-ring-inner{width:100%;height:100%;border-radius:50%;background:var(--color-surface);display:grid;place-items:center;text-align:center}
    .xp-number{font-size:var(--text-xl);font-family:var(--font-display);font-variant-numeric:tabular-nums lining-nums}
    .flow{display:grid;gap:var(--space-4)}
    .flow-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3);align-items:center}
    .flow-node{position:relative;background:var(--color-surface-2);border:1px solid rgba(40,37,29,.12);border-radius:var(--radius-lg);padding:var(--space-4);min-height:102px}
    .flow-node:after{content:'→';position:absolute;right:-16px;top:40%;font-size:1.2rem;color:var(--color-text-faint)}
    .flow-row .flow-node:last-child:after{display:none}
    .legend{display:flex;gap:var(--space-2);flex-wrap:wrap}
    .rule-list{display:grid;gap:var(--space-3)}
    .rule{padding:var(--space-4);border-radius:var(--radius-lg);background:var(--color-surface-2);border:1px solid rgba(40,37,29,.08)}
    .character-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4)}
    .char-card{padding:var(--space-4);border-radius:var(--radius-lg);background:var(--color-surface-2);border:1px solid rgba(40,37,29,.08)}
    .ui-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4)}
    .ui-sample{border:1px dashed rgba(40,37,29,.16);border-radius:var(--radius-lg);padding:var(--space-4);background:linear-gradient(180deg,transparent,var(--color-surface-offset))}
    .bar{height:10px;border-radius:999px;background:var(--color-surface-offset);overflow:hidden}
    .bar > span{display:block;height:100%;background:var(--color-primary);width:var(--w,50%)}
    .footer-note{font-size:var(--text-xs);color:var(--color-text-muted)}
    @media (max-width: 1180px){.hero-grid,.two-col,.triple,.controls,.kpis,.flow-row,.ui-grid,.character-grid{grid-template-columns:1fr 1fr}.app{grid-template-columns:88px 1fr}.sidebar .label-text,.sidebar .nav-note,.brand-copy{display:none}.nav button{justify-content:center;padding:var(--space-3)}}
    @media (max-width: 760px){html,body{overflow:auto} .app{display:block;height:auto}.sidebar{display:none}.header{position:sticky}.main{overflow:visible;padding:var(--space-4)}.hero-grid,.two-col,.triple,.controls,.kpis,.flow-row,.ui-grid,.character-grid{grid-template-columns:1fr}.header{padding:var(--space-4)} .header h2{font-size:var(--text-lg)} }
    @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <svg viewBox="0 0 64 64" fill="none" aria-label="Mascot simulator logo" role="img">
          <circle cx="32" cy="32" r="26" stroke="currentColor" stroke-width="4"/>
          <path d="M20 36c5 8 19 8 24 0" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
          <circle cx="24" cy="26" r="3" fill="currentColor"/>
          <circle cx="40" cy="26" r="3" fill="currentColor"/>
          <path d="M14 20c5-6 10-8 16-8M50 20c-5-6-10-8-16-8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <div class="brand-copy">
          <h1>Maltese Learning<br>Simulator</h1>
          <p>Behavior → feeling → reward balance</p>
        </div>
      </div>
      <p class="nav-note">Designed for child language practice loops, mascot state logic, and reward-frequency calibration.</p>
      <nav class="nav" id="nav"></nav>
    </aside>
    <header class="header">
      <div>
        <h2 id="pageTitle">Simulator dashboard</h2>
        <p id="pageLead">Tune age, challenge, and feedback density while testing mascot reactions and rewards.</p>
      </div>
      <div class="header-actions">
        <button class="chip-btn" id="scenarioBtn" aria-label="Cycle through sample behaviors"><span>Scenario</span><strong id="scenarioName">Pronunciation streak</strong></button>
        <button class="icon-btn" data-theme-toggle aria-label="Switch to dark mode">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>
    <main class="main" id="main">
      <section class="page active" id="page-dashboard"></section>
      <section class="page" id="page-rules"></section>
      <section class="page" id="page-flow"></section>
      <section class="page" id="page-ui"></section>
      <section class="page" id="page-characters"></section>
    </main>
  </div>

  <script>
    const sections = [
      { id:'dashboard', label:'Simulator', lead:'Tune age, challenge, and feedback density while testing mascot reactions and rewards.' },
      { id:'rules', label:'Rules engine', lead:'Review throttles, fatigue protections, and intrinsic-motivation guardrails.' },
      { id:'flow', label:'Interaction flow', lead:'See trigger logic from learner behavior to emotion state and reward output.' },
      { id:'ui', label:'UI guidelines', lead:'Inspect animation timing, accessibility, and spacing rules for mascot feedback.' },
      { id:'characters', label:'Mascot roles', lead:'Compare hero-villain framing options and how each changes tone in the app.' }
    ];

    const behaviors = [
      { key:'correct_pronunciation', label:'Correct pronunciation', category:'Skill mastery', intensity:68, momentum:15, emotionalState:'celebratory', reaction:'Benni leans forward, tail-swish burst, bright ear perk, short praise line.', reward:'XP +12; pronunciation combo waffles; unlocks a supportive micro-story beat after 3 hits.', ages:{5:'Immediate verbal praise + sparkle',8:'Skill streak meter + coaching praise',11:'Precision badge progress + replay choice'} },
      { key:'streak_maintenance', label:'Streak maintenance', category:'Habit building', intensity:54, momentum:28, emotionalState:'encouraging', reaction:'Benni offers a confident nod and soft paw-tap, framing progress as effort not obligation.', reward:'XP +8; weekly consistency leaf; optional home-screen ribbon after day 5.', ages:{5:'Big visual check-in',8:'Routine badge segment',11:'Self-tracking streak card'} },
      { key:'session_completion', label:'Session completion', category:'Persistence', intensity:61, momentum:22, emotionalState:'celebratory', reaction:'Mascot jumps in place once, then settles into a calm success pose to avoid overhyping every finish.', reward:'XP +10; chapter map step forward; narrative clue after every second full session.', ages:{5:'Treasure chest burst',8:'Map progress reveal',11:'Progress summary + next challenge'} },
      { key:'retry_after_error', label:'Retry after error', category:'Resilience', intensity:43, momentum:9, emotionalState:'empathetic', reaction:'Benni softens eyes, tilts head, and says the mistake is part of learning before offering one scaffold.', reward:'Low XP +4; no badge; resilience counter hidden from child but used for supportive pacing.', ages:{5:'Gentle reassurance',8:'Hint with reset confidence',11:'Error framing + choice of help mode'} },
      { key:'help_request', label:'Help request', category:'Self-advocacy', intensity:38, momentum:5, emotionalState:'encouraging', reaction:'Mascot crouches to eye level and frames help-seeking as smart strategy rather than failure.', reward:'No public reward; adaptive hint quality rises; future badge criteria may count strategic help use.', ages:{5:'Guided hint bubble',8:'Hint token explanation',11:'Metacognition prompt'} },
      { key:'return_after_absence', label:'Return after absence', category:'Re-engagement', intensity:50, momentum:18, emotionalState:'empathetic', reaction:'Benni welcomes the child back without penalty language, then highlights one easy win.', reward:'XP +6 comeback bonus once per return window; no streak shaming; map recap card.', ages:{5:'Welcome-back celebration',8:'Fresh start card',11:'Recovery path choice'} }
    ];

    const ageProfiles = {
      '5-7': { label:'Ages 5–7', rewardNeed:74, fatigueRisk:69, autonomyNeed:28, narrativeNeed:66, tone:'High warmth, immediate clarity, big readable motion.' },
      '8-10': { label:'Ages 8–10', rewardNeed:61, fatigueRisk:54, autonomyNeed:47, narrativeNeed:58, tone:'Balanced celebration, clearer progress systems, short challenge loops.' },
      '11-13': { label:'Ages 11–13', rewardNeed:42, fatigueRisk:62, autonomyNeed:73, narrativeNeed:45, tone:'More self-direction, subtler praise, visible competence tracking.' }
    };

    const mascotModes = {
      benni:{ label:'Benni hero mode', descriptor:'Empathetic Maltese Cockapoo guide; warm, effort-focused, low-threat onboarding.' },
      waffles:{ label:'Waffles hero mode', descriptor:'Playful Cockerel rival; quicker tempo, pluckier challenge framing, stronger underdog energy.' }
    };

    const nav = document.getElementById('nav');
    const pageTitle = document.getElementById('pageTitle');
    const pageLead = document.getElementById('pageLead');
    const pages = [...document.querySelectorAll('.page')];
    const scenarioName = document.getElementById('scenarioName');
    const scenarioBtn = document.getElementById('scenarioBtn');

    let state = {
      page:'dashboard',
      behavior: behaviors[0],
      ageBand:'8-10',
      challenge:58,
      sessionMinutes:9,
      feedbackDensity:52,
      mascot:'benni'
    };

    function rewardDecision() {
      const age = ageProfiles[state.ageBand];
      const b = state.behavior;
      const successSignal = (b.intensity + state.challenge + age.rewardNeed) / 3;
      const fatiguePressure = Math.round((state.feedbackDensity * 0.45) + (age.fatigueRisk * 0.35) + (b.momentum * 0.2));
      const intrinsicSupport = Math.round((100 - state.feedbackDensity) * 0.28 + age.autonomyNeed * 0.42 + state.challenge * 0.3);
      let frequency = 'moderate';
      if (fatiguePressure >= 67) frequency = 'low';
      else if (fatiguePressure <= 42) frequency = 'high';
      const rewardTier = successSignal >= 66 ? 'major' : successSignal >= 49 ? 'standard' : 'light';
      const surfacePrompt = intrinsicSupport >= 60 ? 'reflection prompt' : 'mascot cue';
      const throttle = age.label === 'Ages 5–7' ? 2 : age.label === 'Ages 8–10' ? 3 : 4;
      return { successSignal:Math.round(successSignal), fatiguePressure, intrinsicSupport, frequency, rewardTier, surfacePrompt, throttle };
    }

    function mascotLine(decision){
      const lines = {
        celebratory: {
          major:'You heard the sound and nailed it. Let\'s carry that confidence forward.',
          standard:'Nice work. That sounded stronger than the last round.',
          light:'That was a solid step. Keep your ears open for the next one.'
        },
        encouraging: {
          major:'You kept showing up. That kind of practice builds real language power.',
          standard:'Steady work counts. Let\'s keep the rhythm gentle and clear.',
          light:'You\'re staying with it. One more small win is enough for now.'
        },
        empathetic: {
          major:'That was tricky, and you tried again. That matters more than perfection.',
          standard:'Mistakes help us tune the next try. I\'m here with one helpful hint.',
          light:'No stress. We\'ll make the next step easier and keep moving.'
        }
      };
      return lines[state.behavior.emotionalState][decision.rewardTier];
    }

    function buildNav(){
      nav.innerHTML = sections.map(s => `<button class="${state.page===s.id?'active':''}" data-page="${s.id}"><span class="label-text">${s.label}</span><span aria-hidden="true">›</span></button>`).join('');
      nav.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => setPage(btn.dataset.page)));
    }

    function setPage(id){
      state.page=id;
      pages.forEach(p=>p.classList.toggle('active', p.id===`page-${id}`));
      const meta = sections.find(s=>s.id===id);
      pageTitle.textContent = meta.label;
      pageLead.textContent = meta.lead;
      buildNav();
    }

    function simulatorRows(){
      return behaviors.map((b,i)=>{
        const active = state.behavior.key===b.key;
        return `<tr class="sim-row" data-behavior="${b.key}" ${active?'aria-current="true"':''}>
          <td><strong>${b.label}</strong><div class="faint">${b.category}</div></td>
          <td><span class="badge ${b.emotionalState==='celebratory'?'b-cel':b.emotionalState==='empathetic'?'b-emp':'b-enc'}">${b.emotionalState}</span></td>
          <td>${b.reaction}</td>
          <td>${b.reward}</td>
          <td>${b.ages[state.ageBand.split('-')[0]]}</td>
        </tr>`;
      }).join('');
    }

    function renderDashboard(){
      const page = document.getElementById('page-dashboard');
      const decision = rewardDecision();
      const progressFill = Math.min(92, Math.max(18, decision.successSignal));
      page.innerHTML = `
        <div class="hero-grid">
          <div class="card">
            <div class="legend" style="margin-bottom:var(--space-4)">
              <span class="badge b-enc">Encouraging</span>
              <span class="badge b-cel">Celebratory</span>
              <span class="badge b-emp">Empathetic</span>
              <span class="badge b-rew">Rewards throttled</span>
            </div>
            <h3>Functional simulation table</h3>
            <p class="muted" style="margin-bottom:var(--space-4)">Select a target learner behavior, then adjust age band, challenge, session length, and feedback density to test how the mascot should respond without creating reward fatigue.</p>
            <div class="controls" style="margin-bottom:var(--space-5)">
              <label>Age band
                <select id="ageBand">
                  ${Object.entries(ageProfiles).map(([k,v])=>`<option value="${k}" ${state.ageBand===k?'selected':''}>${v.label}</option>`).join('')}
                </select>
              </label>
              <label>Mascot mode
                <select id="mascotMode">
                  ${Object.entries(mascotModes).map(([k,v])=>`<option value="${k}" ${state.mascot===k?'selected':''}>${v.label}</option>`).join('')}
                </select>
              </label>
              <label>Challenge level <span class="faint">${state.challenge}</span>
                <input id="challenge" type="range" min="20" max="90" value="${state.challenge}" />
              </label>
              <label>Feedback density <span class="faint">${state.feedbackDensity}</span>
                <input id="feedbackDensity" type="range" min="15" max="90" value="${state.feedbackDensity}" />
              </label>
            </div>
            <table aria-label="Behavior mapping table">
              <thead>
                <tr><th>Behavior</th><th>Emotion</th><th>Mascot reaction</th><th>Reward trigger</th><th>Age tuning</th></tr>
              </thead>
              <tbody>${simulatorRows()}</tbody>
            </table>
          </div>
          <div class="card">
            <h3>Live mascot response</h3>
            <div class="mascot-stage">
              <div class="speech">${mascotLine(decision)}</div>
              <div class="mascot-shell">
                ${renderMascotSvg(state.behavior.emotionalState)}
              </div>
            </div>
            <div class="stage-meta">
              <span class="token">${state.behavior.label}</span>
              <span class="token">${ageProfiles[state.ageBand].label}</span>
              <span class="token">${mascotModes[state.mascot].descriptor}</span>
            </div>
            <div class="two-col" style="margin-top:var(--space-5)">
              <div class="xp-ring" style="--fill:${progressFill}">
                <div class="xp-ring-inner"><div><div class="xp-number">${decision.successSignal}</div><div class="faint">engagement fit</div></div></div>
              </div>
              <div>
                <h4>Reward output</h4>
                <p><strong>${decision.rewardTier}</strong> reward tier with <strong>${decision.frequency}</strong> frequency.</p>
                <p class="muted" style="margin-top:var(--space-2)">Show a ${decision.surfacePrompt}, keep visible reward bursts to every ${decision.throttle} qualifying events, and convert the rest into coaching language or progress meters.</p>
              </div>
            </div>
          </div>
        </div>
        <div class="kpis">
          <div class="kpi"><div class="label">Fatigue pressure</div><div class="value">${decision.fatiguePressure}</div><div class="faint">Lower is safer</div></div>
          <div class="kpi"><div class="label">Intrinsic support</div><div class="value">${decision.intrinsicSupport}</div><div class="faint">Higher keeps motivation internal</div></div>
          <div class="kpi"><div class="label">Reward throttle</div><div class="value">1 / ${decision.throttle}</div><div class="faint">Visible celebrations</div></div>
          <div class="kpi"><div class="label">Session target</div><div class="value">${state.sessionMinutes}m</div><div class="faint">Short loop for children</div></div>
        </div>
        <div class="two-col">
          <div class="card">
            <h3>Design intent</h3>
            <p>The simulator favors emotionally specific feedback over constant prizes. Correct pronunciation and session completion can create celebratory responses, while retries and returns after absence lean empathetic so the app protects confidence first.</p>
            <p class="muted" style="margin-top:var(--space-3)">${ageProfiles[state.ageBand].tone}</p>
          </div>
          <div class="card">
            <h3>Intrinsic motivation guardrail</h3>
            <p>When feedback density rises or fatigue pressure crosses 67, the engine shifts from public rewards to softer signals: progress bars, reflective prompts, and optional narrative reveals. Older children get more autonomy, less confetti, and more competence tracking.</p>
          </div>
        </div>`;

      page.querySelectorAll('.sim-row').forEach(row=>row.addEventListener('click',()=>{ state.behavior = behaviors.find(b=>b.key===row.dataset.behavior); scenarioName.textContent = state.behavior.label; renderAll(); }));
      page.querySelector('#ageBand').addEventListener('change',e=>{state.ageBand=e.target.value;renderAll();});
      page.querySelector('#mascotMode').addEventListener('change',e=>{state.mascot=e.target.value;renderAll();});
      page.querySelector('#challenge').addEventListener('input',e=>{state.challenge=+e.target.value;renderAll();});
      page.querySelector('#feedbackDensity').addEventListener('input',e=>{state.feedbackDensity=+e.target.value;renderAll();});
    }

    function renderMascotSvg(emotion){

        <path d="M48 110c2-8 4-16 6-24" stroke="${heroColor}" stroke-width="2" opacity=".5"/>
        <path d="M172 110c-2-8-4-16-6-24" stroke="${heroColor}" stroke-width="2" opacity=".5"/>

        <!-- Head -->
        <ellipse cx="110" cy="118" rx="68" ry="62" fill="var(--color-surface-2)" stroke="${heroColor}" stroke-width="4"/>
        <path d="M52 115c3-3 6-6 9-9M168 115c-3-3-6-6-9-9M70 80c5-2 10-4 15-5M150 80c-5-2-10-4-15-5" stroke="${heroColor}" stroke-width="2" opacity=".4" fill="none"/>

        <!-- Ear tops -->
        <ellipse cx="68" cy="78" rx="14" ry="20" fill="${heroColor}" opacity=".85"/>
        <ellipse cx="152" cy="78" rx="14" ry="20" fill="${heroColor}" opacity=".85"/>

        <!-- Body -->
        <ellipse cx="110" cy="170" rx="48" ry="32" fill="${heroColor}" opacity=".15"/>

        <!-- Eyes with highlights -->
        <ellipse cx="84" cy="108" rx="9" ry="10" fill="var(--color-text)"/>
        <ellipse cx="136" cy="108" rx="9" ry="10" fill="var(--color-text)"/>
        <circle cx="86" cy="105" r="3" fill="white" opacity=".9"/>
        <circle cx="138" cy="105" r="3" fill="white" opacity=".9"/>

        <ellipse cx="110" cy="128" rx="14" ry="10" fill="var(--color-surface-offset)"/>
        <ellipse cx="110" cy="125" rx="5" ry="4" fill="var(--color-text)"/>

        <!-- Mouth -->
        <path d="M98 135c4 5 14 5 18 0" stroke="var(--color-text)" stroke-width="3" stroke-linecap="round" fill="none"/>

        <!-- Whiskers -->
        <path d="M72 120c3 2 6 4 9 5M148 120c-3 2-6 4-9 5" stroke="${heroColor}" stroke-width="2" opacity=".5"/>

        <!-- Tail -->
        <path d="M165 155c10-5 18-2 22 6 3 6 2 12-2 16" stroke="${heroColor}" stroke-width="6" stroke-linecap="round" fill="none" opacity=".7"/>
      </svg>`;
    }

    function renderRules(){
      const page = document.getElementById('page-rules');
      page.innerHTML = `
        <div class="two-col">
          <div class="card">
            <h3>Design-rules engine</h3>
            <div class="rule-list">
              <div class="rule"><strong>Rule 1 — Match emotion to learning meaning.</strong><br><span class="muted">Celebratory for mastery and completion, encouraging for habits and help-seeking, empathetic for errors, return gaps, or fragile confidence moments.</span></div>
              <div class="rule"><strong>Rule 2 — Cap visible rewards.</strong><br><span class="muted">Ages 5–7 can see a visible celebration every second strong success, ages 8–10 every third, ages 11–13 every fourth; intermediate wins become verbal reinforcement or quiet meter progress.</span></div>
              <div class="rule"><strong>Rule 3 — Never pair failure with loss language.</strong><br><span class="muted">No mascot disappointment faces, no broken streak theatrics, no negative scoreboard sounds; switch to repair cues and next-step hints.</span></div>
              <div class="rule"><strong>Rule 4 — Escalate narrative, not only currency.</strong><br><span class="muted">After repeated mastery, unlock story snippets, helper characters, or world exploration to keep curiosity stronger than prize chasing.</span></div>
              <div class="rule"><strong>Rule 5 — Reward effort visibility during hard tasks.</strong><br><span class="muted">If challenge exceeds 70 and success dips, praise attention, retries, or strategy choices before accuracy rewards return.</span></div>
            </div>
          </div>
          <div class="card">
            <h3>Fatigue balancing matrix</h3>
            <table>
              <thead><tr><th>Condition</th><th>Risk</th><th>Engine action</th><th>Reason</th></tr></thead>
              <tbody>
                <tr><td>High density + easy task</td><td>Reward inflation</td><td>Reduce XP by 30%; delay badges; emphasize curiosity prompt</td><td>Prevents children from learning only for treats</td></tr>
                <tr><td>High density + long session</td><td>Sensory overload</td><td>Mute particles, shorten voice line, use one calm animation cycle</td><td>Keeps feedback digestible</td></tr>
                <tr><td>Low success + high effort</td><td>Shame spiral</td><td>Switch to empathetic state and scaffolded hint path</td><td>Protects persistence identity</td></tr>
                <tr><td>Older age + repetitive praise</td><td>Perceived babyishness</td><td>Swap mascot gushing for stats summary or self-rating prompt</td><td>Supports autonomy and competence</td></tr>
                <tr><td>Return after absence</td><td>Streak guilt</td><td>Offer comeback bonus, never show lost streak animation</td><td>Re-entry should feel safe</td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="triple">
          <div class="card"><h3>Age 5–7</h3><p>Use bigger expressions, simpler praise, and immediate cause-effect. Keep copy under seven words and let the mascot animate once, then rest.</p><div class="bar" style="margin-top:var(--space-3)"><span style="--w:74%"></span></div><p class="footer-note" style="margin-top:var(--space-2)">Reward sensitivity: high.</p></div>
          <div class="card"><h3>Age 8–10</h3><p>Blend visible rewards with a readable progress system. Children can understand why a badge did not appear if the app shows steady meter growth.</p><div class="bar" style="margin-top:var(--space-3)"><span style="--w:61%"></span></div><p class="footer-note" style="margin-top:var(--space-2)">Best balance band for mixed systems.</p></div>
          <div class="card"><h3>Age 11–13</h3><p>Dial down cuteness and increase agency. Use mastery labels, challenge choices, and unlockable story paths rather than constant sparkles.</p><div class="bar" style="margin-top:var(--space-3)"><span style="--w:42%"></span></div><p class="footer-note" style="margin-top:var(--space-2)">Public rewards should feel earned, not childish.</p></div>
        </div>`;
    }

    function renderFlow(){
      const page = document.getElementById('page-flow');
      page.innerHTML = `
        <div class="card">
          <h3>Interaction flow charts</h3>
          <div class="flow">
            <div class="flow-row">
              <div class="flow-node"><h4>1. Detect behavior</h4><p>Pronunciation hit, streak check-in, completed session, retry, or help request.</p></div>
              <div class="flow-node"><h4>2. Score context</h4><p>Read age band, challenge, elapsed session time, recent feedback count, and confidence signals.</p></div>
              <div class="flow-node"><h4>3. Pick emotion</h4><p>Map to encouraging, celebratory, or empathetic state using behavior meaning first.</p></div>
              <div class="flow-node"><h4>4. Output reward</h4><p>Grant quiet meter progress, XP, badge segment, or narrative unlock if throttle allows.</p></div>
            </div>
            <div class="flow-row">
              <div class="flow-node"><h4>Mastery branch</h4><p>Accuracy improves twice in a row.</p></div>
              <div class="flow-node"><h4>Celebration check</h4><p>If visible reward quota not recently used, play one burst animation.</p></div>
              <div class="flow-node"><h4>Throttle branch</h4><p>If quota already spent, convert burst into line of praise + subtle glow.</p></div>
              <div class="flow-node"><h4>Next task</h4><p>Offer another word or short replay so momentum continues.</p></div>
            </div>
            <div class="flow-row">
              <div class="flow-node"><h4>Recovery branch</h4><p>Error, pause, or return after absence detected.</p></div>
              <div class="flow-node"><h4>Empathy first</h4><p>Lower animation amplitude and simplify audio cue.</p></div>
              <div class="flow-node"><h4>Scaffold</h4><p>Offer hint, slowed sample, or easier contrast pair.</p></div>
              <div class="flow-node"><h4>Re-entry win</h4><p>Present an easy-success task before normal difficulty resumes.</p></div>
            </div>
          </div>
        </div>
        <div class="two-col">
          <div class="card">
            <h3>Logic constraints</h3>
            <ul style="display:grid;gap:var(--space-3);padding-left:1rem">
              <li>No more than one major animation burst inside 25 seconds.</li>
              <li>No badge award for help requests or first recovery attempts.</li>
              <li>Pronunciation rewards require either correct output or measurable improvement, not random time-on-task alone.</li>
              <li>Streak feedback must never imply punishment after absence.</li>
              <li>Story unlocks should trail mastery by one or two events to maintain anticipation.</li>
            </ul>
          </div>
          <div class="card">
            <h3>Example loop</h3>
            <p>A child says a target Maltese word correctly after one retry. The app marks improvement, plays Benni’s encouraging ear perk instead of full confetti because a celebration happened recently, then grants XP and advances the pronunciation combo meter.</p>
          </div>
        </div>`;
    }

    function renderUi(){
      const page = document.getElementById('page-ui');
      page.innerHTML = `
        <div class="two-col">
          <div class="card">
            <h3>Mascot animation guidelines</h3>
            <table>
              <thead><tr><th>State</th><th>Body language</th><th>Timing</th><th>Audio</th><th>Use case</th></tr></thead>
              <tbody>
                <tr><td>Encouraging</td><td>Small tail wag, head nod, half-step bounce</td><td>600–900ms</td><td>Soft chime or voiced cue</td><td>Routine effort, streak maintenance, help-seeking</td></tr>
                <tr><td>Celebratory</td><td>One hop, sparkle burst, proud posture</td><td>900–1400ms</td><td>Brighter layered cue, never louder than speech</td><td>Mastery moments, session completion, story unlock</td></tr>
                <tr><td>Empathetic</td><td>Head tilt, softened eyes, slower inhale-exhale loop</td><td>800–1200ms</td><td>Warm low-intensity cue or silence</td><td>Errors, return after absence, frustration recovery</td></tr>
              </tbody>
            </table>
          </div>
          <div class="card">
            <h3>UI composition rules</h3>
            <div class="rule-list">
              <div class="rule"><strong>Motion budget:</strong> Keep mascot motion in a 24–32px travel envelope so rewards feel lively without hijacking reading focus.</div>
              <div class="rule"><strong>Speech bubbles:</strong> Max 90 characters for young readers; line breaks after verbs or praise phrase boundaries.</div>
              <div class="rule"><strong>Color use:</strong> One emotion color per moment, with neutrals around it; celebratory green or gold should not compete with navigation accents.</div>
              <div class="rule"><strong>Accessibility:</strong> Pair animation with text and optional sound, and support reduced motion by collapsing sequences to opacity and color changes.</div>
            </div>
          </div>
        </div>
        <div class="ui-grid">
          <div class="ui-sample">
            <h4>Reward card</h4>
            <p style="margin-bottom:var(--space-3)"><span class="badge b-cel">Session complete</span></p>
            <p><strong>+10 XP</strong> and one map step. Animation should end in a stable resting pose rather than continuous bouncing.</p>
          </div>
          <div class="ui-sample">
            <h4>Empathy card</h4>
            <p style="margin-bottom:var(--space-3)"><span class="badge b-emp">Try again</span></p>

          </div>
          <div class="ui-sample">
            <h4>Progress meter</h4>
            <div class="bar" style="margin:var(--space-3) 0"><span style="--w:68%"></span></div>
            <p>Use quiet continuous progress between bigger rewards so the child sees growth without constant prize bursts.</p>
          </div>
          <div class="ui-sample">
            <h4>Narrative unlock</h4>
            <p><span class="badge b-rew">Story clue</span></p>
            <p style="margin-top:var(--space-3)">Best for cumulative mastery. The unlock should feel like discovery, not bribery.</p>
          </div>
        </div>`;
    }

        <div class="character-grid">

    function renderAll(){
      renderDashboard();
      renderRules();
      renderFlow();
      renderUi();
      renderCharacters();
      buildNav();
      setPage(state.page);
    }

    scenarioBtn.addEventListener('click',()=>{
      const idx = behaviors.findIndex(b=>b.key===state.behavior.key);
      state.behavior = behaviors[(idx+1)%behaviors.length];
      scenarioName.textContent = state.behavior.label;
      renderAll();
    });

    document.querySelector('[data-theme-toggle]').addEventListener('click',()=>{
      const root = document.documentElement;
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      document.querySelector('[data-theme-toggle]').setAttribute('aria-label', `Switch to ${next === 'dark' ? 'light' : 'dark'} mode`);
      document.querySelector('[data-theme-toggle]').innerHTML = next === 'dark'
        ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
        : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    });

    renderAll();
  </script>
</body>
